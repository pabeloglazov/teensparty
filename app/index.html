<style>

.dd{border:1px solid var(--line2);border-radius:14px;background:var(--card2);overflow:hidden}

.dashgrid{display:flex;flex-direction:column;gap:12px}

.prog{height:6px;border-radius:999px;background:#22252C;overflow:hidden}

.hist{display:flex;gap:6px}

@keyframes b{from{background-position:200% 0}to{background-position:-200% 0}}
.empty{padding:28px 8px;text-align:center;color:var(--mu);font-size:14px}
.banner{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 14px;border-radius:16px;border:1px solid var(--acc);background:var(--accbg);text-align:left;width:100%}
.tip{min-height:18px;font-size:13px;font-weight:600;color:var(--tx2)}
.qrbox{background:#fff;border-radius:18px;padding:18px;display:flex;justify-content:center}
.login{max-width:420px;margin:0 auto;padding:56px 24px;display:flex;flex-direction:column;gap:18px}
.err{font-size:13px;color:var(--acc)}
.list2{display:flex;flex-direction:column;gap:6px}
/* ПК */
@media (min-width:900px){
  .app{flex-direction:row}
  .nav{order:-1;position:static;width:240px;flex-shrink:0;display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:24px 14px;border-top:none;border-right:1px solid #22252C}
  .nav button{flex-direction:row;justify-content:flex-start;gap:12px;padding:0 14px;min-height:48px;border-radius:12px;font-size:15px}
  .nav button.on{background:var(--accbg)}
  .nav .c .ring{width:auto;height:auto;margin:0;border:none;background:none}

  .brand{display:block;font-family:Unbounded,sans-serif;font-weight:700;font-size:18px;padding:4px 14px 20px;color:var(--tx)}
  .brand span{color:var(--acc)}
  .wrap{padding:32px 32px 60px;max-width:820px}
  .ov{justify-content:center;align-items:center}

  .sheet{position:relative;width:520px;border-radius:24px;border:1px solid var(--line2);max-height:88vh}
  .full{left:auto;width:560px;border-left:1px solid var(--line2);box-shadow:-24px 0 60px rgba(0,0,0,.5)}
  .toast{bottom:32px}
  .teens2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
}
@media print{.nav,.noprint{display:none!important}.qrbox{border:none}}

<body>

<script>
const API = 'https://script.google.com/macros/s/AKfycbw1J4PnxNLtZ8H8dCWhJpTiAeA2V-X5RWmJdB6VQPr_IFzemiKS-y_SW50PvR0dAnL6Cg/exec';
const APP = new URL('./', location.href).href;
const EXEC = APP;
const LS = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }, del: k => { try { localStorage.removeItem(k); } catch (e) {} } };
let S = { lang: LS.get('sol_lang') || 'ru', token: LS.get('sol_tok') || '', tab: null, more: 'root', q: '', tq: '', closed: {}, meet: null, ov: null, toast: '', busy: 0, dash: 'all', login: { step: 'email' } };
let D = null, IDX = null;
const $app = document.getElementById('app');
const L = () => S.lang === 'en';
const tr = (ru, en) => L() ? en : ru;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ACC = '#FF8A3D';

// ---------- иконки ----------
const IC = {
  dash: 'M18 20V10M12 20V4M6 20v-6', teens: 'M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 3a4 4 0 1 1 0 8a4 4 0 1 1 0-8M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75',
  mark: 'M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11', tasks: 'M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z',
  more: 'M3 12h18M3 6h18M3 18h18', back: 'M15 18l-6-6 6-6', chev: 'M6 9l6 6 6-6', right: 'M9 18l6-6-6-6', plus: 'M12 5v14M5 12h14', check: 'M5 12l5 5L19 7',
  search: 'M11 4a7 7 0 1 1 0 14a7 7 0 1 1 0-14M21 21l-4.3-4.3', x: 'M6 6l12 12M18 6L6 18', medal: 'M12 15a6 6 0 1 1 0-12a6 6 0 1 1 0 12M8.2 13.9L7 22l5-3 5 3-1.2-8.1',
  userplus: 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 3a4 4 0 1 1 0 8a4 4 0 1 1 0-8M20 8v6M23 11h-6', qr: 'M3 3h6v6H3zM15 3h6v6h-6zM3 15h6v6H3zM15 15h2v2h-2zM19 15h2M15 19h2M19 19h2v2',
  eye: 'M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8zM12 9a3 3 0 1 1 0 6a3 3 0 1 1 0-6', cake: 'M4 21h16v-8H4zM4 16c2 1 4 1 6 0s4-1 6 0 4 1 4 0M12 13V9M12 6a1.5 1.5 0 0 1 0-3',
  pen: 'M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z', trash: 'M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6'
};
const t12 = v => { const m = /^(\d{1,2}):(\d{2})$/.exec(String(v || '')); if (!m) return String(v || ''); const h = +m[1]; return ((h % 12) || 12) + ':' + m[2] + ' ' + (h < 12 ? 'AM' : 'PM'); };
const svg = (d, c, w, sw) => `<svg width="${w || 20}" height="${w || 20}" viewBox="0 0 24 24" fill="none" stroke="${c || 'currentColor'}" stroke-width="${sw || 2}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"></path></svg>`;

// ---------- даты ----------
const MON_RU = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MON_EN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DLONG = () => L() ? ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'] : ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const DSHORT = () => L() ? ['Su','Mo','Tu','We','Th','Fr','Sa'] : ['вс','пн','вт','ср','чт','пт','сб'];
const pad = n => (n < 10 ? '0' : '') + n;
const parse = s => { const p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); };
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const human = s => { if (!s) return ''; const d = parse(s); return L() ? MON_EN[d.getMonth()] + ' ' + d.getDate() : d.getDate() + ' ' + MON_RU[d.getMonth()]; };
const todayD = () => parse(D.today);
const daysAgo = s => Math.round((todayD() - parse(s)) / 86400000);
const word = s => { const n = daysAgo(s); return n === 0 ? tr('сегодня', 'today') : n === 1 ? tr('вчера', 'yesterday') : human(s); };
const lastDow = wd => { const t = todayD(); const x = new Date(t); x.setDate(t.getDate() - ((t.getDay() - wd + 7) % 7)); return iso(x); };
const plural = (n, a, b, c) => (n % 10 === 1 && n % 100 !== 11) ? a : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) ? b : c;

// ---------- сервер ----------
function call(fn, ...args) {
  S.busy++; paintBusy();
  return fetch(API, { method: 'POST', body: JSON.stringify({ fn, args }) })
    .then(r => r.json(), () => { throw new Error('network'); })
    .then(j => { if (!j.ok) throw new Error(j.error); return j.data; })
    .finally(() => { S.busy--; paintBusy(); });
}

const ERR = () => ({ network: tr('Нет связи с сервером. Проверьте интернет.', 'No connection. Check your internet.'), bad_email: tr('Проверьте email', 'Check the email'), not_invited: tr('Этой почты нет в команде. Попросите админа пригласить вас.', 'This email isn’t on the team. Ask an admin to invite you.'), bad_code: tr('Неверный или устаревший код', 'Wrong or expired code'), bad_invite: tr('Код приглашения не найден', 'Invite code not found'), invite_expired: tr('Код приглашения устарел', 'Invite code expired'), email_taken: tr('Эта почта уже в команде', 'This email is already on the team'), need_name: tr('Введите имя', 'Enter a name'), need_title: tr('Напишите, что нужно сделать', 'Describe the task'), preview: tr('Это просмотр глазами другого — изменения отключены', 'Preview mode — changes are disabled') });

// ---------- индексы ----------
function buildIdx() {
  const set = new Set(), sess = {}, total = {}, allDates = {};
  D.att.forEach(([d, k, m, t]) => {
    set.add(d + '|' + k + '|' + m + '|' + t);
    const key = k + ':' + m; (sess[key] = sess[key] || new Set()).add(d);
    total[t] = (total[t] || 0) + 1;
    allDates[d] = 1;
  });
  const S2 = {}; Object.keys(sess).forEach(k => S2[k] = Array.from(sess[k]).sort());
  IDX = { set, sess: S2, total, teen: Object.fromEntries(D.teens.map(t => [t.id, t])), group: Object.fromEntries(D.groups.map(g => [g.id, g])) };
}
const has = (d, k, m, t) => IDX.set.has(d + '|' + k + '|' + m + '|' + t);
const R = () => ({ win: +D.settings.win || 8, reg: +D.settings.reg || 6, gone: +D.settings.gone || 3 });
const tname = t => ((t.first || '') + ' ' + (t.last || '')).trim();
const ini = n => String(n).split(/\s+/).map(x => x[0] || '').join('').slice(0, 2).toUpperCase();
const members = gid => D.teens.filter(t => t.groups.indexOf(gid) >= 0);
const myRole = () => D.me.role;
const isAdmin = () => myRole() === 'admin';

function stat(t, kind, meetId, before) {
  let key = kind === 'event' ? 'service:sunday' : kind + ':' + meetId;
  // пока у среды/пятницы мало своей истории — списки строим по воскресеньям
  if (kind === 'service' && (IDX.sess[key] || []).filter(d => d < before).length < 3) key = 'service:sunday';
  const [k, m] = key.split(':');
  const r = R();
  const sess = (IDX.sess[key] || []).filter(d => d < before).slice(-r.win);
  const created = t.createdAt || '0000';
  const h = sess.map(d => d < created ? '-' : (has(d, k, m, t.id) ? '1' : '0'));
  const known = h.filter(c => c !== '-').length;
  const cnt = h.filter(c => c === '1').length;
  let miss = 0; for (let i = h.length - 1; i >= 0; i--) { if (h[i] === '1') break; if (h[i] === '0') miss++; }
  const total = IDX.total[t.id] || 0;
  let cat;
  if (total < 4) cat = 'new';
  else if (!known) cat = 'some';
  else if (cnt === 0) cat = 'archive';
  else if (miss >= r.gone) cat = 'gone';
  else if (cnt >= r.reg || (known < r.win && cnt / known >= r.reg / r.win)) cat = 'reg';
  else cat = 'some';
  const label = cat === 'gone' ? tr('нет ' + miss + ' подряд', 'missed ' + miss + ' in a row') : (known ? cnt + tr(' из ', ' of ') + known : tr('новый', 'new'));
  return { cat, label, cnt, miss, total, known, h, sess };
}
const CAT = () => ({ reg: tr('обычно приходит', 'regular'), some: tr('иногда', 'sometimes'), gone: tr('давно не был', 'missing lately'), archive: tr('архив', 'archive'), new: tr('новенький', 'newcomer') });

function markSections() {
  const m = meet(); const q = S.q.trim().toLowerCase();
  const on = id => has(m.date, m.kind, m.meetId, id);
  const before = m.date;
  const ST = {}; D.teens.forEach(t => ST[t.id] = stat(t, m.kind, m.meetId, before));
  const mk = t => ({ t, st: ST[t.id], on: on(t.id) });
  let secs = [];
  if (q) {
    const hits = D.teens.filter(t => tname(t).toLowerCase().indexOf(q) >= 0).map(mk);
    if (hits.length) secs.push({ key: 'found', title: tr('НАЙДЕНО', 'FOUND'), items: hits, open: true });
  } else {
    let pool = D.teens;
    if (m.kind === 'group') {
      pool = members(m.meetId);
      const guests = D.teens.filter(t => on(t.id) && t.groups.indexOf(m.meetId) < 0).map(mk);
      if (guests.length) secs.push({ key: 'guests', title: tr('ГОСТИ', 'GUESTS'), items: guests });
    }
    const of = c => pool.filter(t => ST[t.id].cat === c).map(mk);
    secs.push({ key: 'new', title: tr('НОВЕНЬКИЕ', 'NEWCOMERS'), items: of('new'), color: ACC });
    secs.push({ key: 'reg', title: tr('ОБЫЧНО ПРИХОДЯТ', 'REGULARS'), items: of('reg').sort((a, b) => b.st.cnt - a.st.cnt) });
    secs.push({ key: 'some', title: tr('ИНОГДА', 'SOMETIMES'), items: of('some').sort((a, b) => b.st.cnt - a.st.cnt) });
    secs.push({ key: 'gone', title: tr('ДАВНО НЕ БЫЛИ', 'MISSING LATELY'), items: of('gone').sort((a, b) => a.st.miss - b.st.miss), color: '#6FA8FF' });
    secs.push({ key: 'archive', title: tr('АРХИВ', 'ARCHIVE'), items: of('archive'), color: '#8B8B94', defClosed: true });
    secs = secs.filter(s => s.items.length);
    secs.forEach(s => s.open = S.closed[s.key] !== undefined ? !S.closed[s.key] : !s.defClosed);
  }
  return secs;
}

function viewMark() {

  const cnt = D.teens.filter(t => has(m.date, m.kind, m.meetId, t.id)).length;

  return `<div style="display:flex;align-items:center;gap:8px">

    const now = [];

    visibleGroups().filter(g => g.day === dow).forEach(g => now.push(item({ kind: 'group', meetId: g.id, label: g.name, date: D.today }, tr('сегодня · ', 'today · ') + t12(g.time))));
    SVCS().filter(s => s.day !== dow).map(s => svc(lastDow(s.day), s.id)).sort((x, y) => y.date.localeCompare(x.date)).forEach(x => now.push(item(x, tr('прошедшая · ', 'past · ') + word(x.date) + ', ' + human(x.date))));

async function syncMarks() {
  if (!S.token || !D || S.tab !== 'mark' || document.hidden || syncBusy || markPend > 0) return;
  const m = meet(); const key = mkKey(m); syncBusy = true;
  try {
    const r = await fetch(API, { method: 'POST', body: JSON.stringify({ fn: 'api', args: [S.token, 'attNow', Object.assign({ kind: m.kind, meetId: m.meetId, date: m.date }, S.as || {})] }) }).then(x => x.json());
    if (!r.ok || mkKey(meet()) !== key || markPend > 0) return;
    const by = {}; r.data.forEach(a => by[a[0]] = { n: a[1], t: a[2], mine: !!a[3] });
    const before = D.att.filter(a => a[0] === m.date && a[1] === m.kind && a[2] === m.meetId).map(a => a[3]).sort().join();
    const after = Object.keys(by).sort().join();
    const labels = JSON.stringify(MK.by) !== JSON.stringify(by);
    MK = { key, by };
    if (before !== after) { D.att = D.att.filter(a => !(a[0] === m.date && a[1] === m.kind && a[2] === m.meetId)).concat(Object.keys(by).map(id => [m.date, m.kind, m.meetId, id])); buildIdx(); }
    if (before !== after || labels) softRender();

}

  // группы
  editSvc(id) { const s = id ? svcOf(id) : null; S.ov = { type: 'svc', id: id || '', f: s ? { name: s.name, day: String(s.day), time: s.time } : { name: '', day: '6', time: '19:00' } }; rerender(); },
  delSvc(id) { S.ov = { type: 'svcDel', id }; rerender(); },
  async delSvcOk() { const id = S.ov.id; S.ov = null; await saveSvcs(SVCA().map(x => x.id === id ? Object.assign(x, { off: 1 }) : x)); },
  async saveSvc() { const F = S.ov.f, id = S.ov.id; const name = (F.name || '').trim(), time = (F.time || '').trim();
    if (!name) { S.ov.err = tr('Введите название', 'Enter a name'); return rerender(); }
    if (!/^\d{1,2}:\d{2}$/.test(time)) { S.ov.err = tr('Укажите время', 'Set a time'); return rerender(); }
    if (SVCS().some(x => x.id !== id && x.day === +F.day && x.time === time)) { S.ov.err = tr('В это время уже есть встреча', 'Another meeting is at this time'); return rerender(); }
    const list = SVCA(); const v = { name, day: +F.day, time };
    if (id) list.forEach(x => { if (x.id === id) Object.assign(x, v); }); else list.push(Object.assign({ id: 's' + Date.now().toString(36), off: 0 }, v));
    S.ov = null; await saveSvcs(list); },
  editGroup(id) { const g = D.groups.find(x => x.id === id); S.ov = { type: 'group', id: id || '', f: g ? { name: g.name, leader: g.leader, day: String(g.day), time: g.time, addr: g.addr || '', contact: g.contact || '' } : { day: '5', time: '19:00' } }; rerender(); },
  async saveGroup() { const F = S.ov.f; if (!(F.name || '').trim()) { S.ov.err = tr('Введите название', 'Enter a name'); return rerender(); }
    try { await api('saveGroup', { id: S.ov.id, name: F.name, leader: F.leader, day: +F.day, time: F.time, addr: F.addr || '', contact: F.contact || '' }); S.ov = null; await load(); toast(tr('Сохранено', 'Saved')); } catch (e) { S.ov.err = errText(e); rerender(); } },
  // правила
  async rule(x) { const [k, d] = x.split(':'); const r = R(); const lim = { win: [3, 12], reg: [1, r.win], gone: [1, 12] }[k]; const v = Math.max(lim[0], Math.min(lim[1], r[k] + (+d))); if (v === r[k]) return;
    D.settings[k] = String(v); rerender(); try { await api('saveSettings', { [k]: v }); } catch (e) { toast(errText(e)); } },
  async qrAlways() { const v = D.settings.qrAlways === '1' ? '0' : '1'; D.settings.qrAlways = v; rerender(); try { await api('saveSettings', { qrAlways: v }); } catch (e) { toast(errText(e)); } },
  // доступ
  openInvite() { S.ov = { type: 'invite', f: { mode: 'email', role: 'leader', groups: [] } }; rerender(); },
  async viewAs(id) { setHash(''); S.as = { as: id }; S.ov = null; S.tab = ''; S.more = 'root'; D = null; render(); await load(); },
  async viewAsRole(r) { setHash(''); S.as = { asRole: r }; S.ov = null; S.tab = ''; S.more = 'root'; D = null; render(); await load(); },
  async exitAs() { setHash('#/more/access'); S.as = null; S.ov = null; S.tab = 'more'; S.more = 'access'; D = null; render(); await load(); },
  evPeople(id) { S.ov = { type: 'evPeople', id }; rerender(); },
  evMark(id) { const e = D.events.find(x => x.id === id); if (!e) return; S.meet = { kind: 'event', meetId: e.id, label: e.name, date: e.date }; S.ov = null; S.q = ''; S.closed = {}; S.tab = 'mark'; render(); syncMarks(); },
  editEv(id) { const e = D.events.find(x => x.id === id); S.ov = { type: 'ev', id: id || '', f: e ? { name: e.name, date: e.date } : { name: '', date: D.today } }; rerender(); },
  delEv(id) { S.ov = { type: 'evDel', id }; rerender(); },
  async saveEv() { const F = S.ov.f, id = S.ov.id; const name = (F.name || '').trim(); if (!name) { S.ov.err = tr('Введите название', 'Enter a name'); return rerender(); }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(F.date || '')) { S.ov.err = tr('Укажите дату', 'Set a date'); return rerender(); }
    try { if (id) await api('editEvent', { id, name, date: F.date }); else await api('addEvent', { name, date: F.date }); S.ov = null; await load(); toast(tr('Сохранено', 'Saved')); } catch (e) { S.ov.err = errText(e); rerender(); } },
  async delEvOk() { const id = S.ov.id; try { await api('delEvent', { id }); S.ov = null; await load(); toast(tr('Удалено', 'Deleted')); } catch (e) { toast(errText(e)); } },
  ageList(x) { S.ov = { type: 'ages', age: x }; rerender(); },
  editLeader(id) { const l = (D.leaders || []).find(x => x.id === id); if (!l || l.me) return; S.ov = { type: 'leader', id, f: { name: l.name, email: l.email, role: l.role, groups: l.groups.slice() } }; rerender(); },
  leadG(g) { const a = S.ov.f.groups; const i = a.indexOf(g); i >= 0 ? a.splice(i, 1) : a.push(g); rerender(); },
  async sendInvite() { const F = S.ov.f; S.ov.err = '';
    try { const r = await api('invite', { mode: F.mode, name: F.name, email: F.email, role: F.role, groups: F.groups }); if (r.code) { S.ov.code = r.code; await load(); S.more = 'access'; rerender(); } else { S.ov = null; toast(tr('Приглашение отправлено', 'Invite sent')); await load(); } }
    catch (e) { S.ov.err = errText(e); rerender(); } },
  copyCode() { const t = tr('Привет! Вот вход в SOL 3:16 Teens: ', 'Hi! Here is your SOL 3:16 Teens access: ') + APP + tr(' — нажми «У меня есть код приглашения» и введи ', ' — tap “I have an invite code” and enter ') + S.ov.code; copy(t); },
  async saveLeader() { const F = S.ov.f; try { await api('updateLeader', { id: S.ov.id, role: F.role, groups: F.groups }); S.ov = null; await load(); toast(tr('Сохранено', 'Saved')); } catch (e) { S.ov.err = errText(e); rerender(); } },
  async removeLeader() { if (!S.ov.confirmRm) { S.ov.confirmRm = true; S.ov.err = ''; return rerender(); }
    try { await api('removeLeader', { id: S.ov.id }); S.ov = null; await load(); toast(tr('Доступ убран', 'Access removed')); } catch (e) { S.ov.err = errText(e); rerender(); } },
  copyJoin() { copy(joinUrl()); },
  copyTeen() { copy(APP + 'me/'); },
  print() { window.print(); }
};
function copy(t) { const done = () => toast(tr('Скопировано', 'Copied')); if (navigator.clipboard) navigator.clipboard.writeText(t).then(done, () => fallbackCopy(t, done)); else fallbackCopy(t, done); }
function fallbackCopy(t, done) { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); done(); } catch (e) {} a.remove(); }

if (S.token) bootFromCache();
render();
if (S.token) { if (D) syncMarks(); load(); }
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
