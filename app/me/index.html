    return `<div class="ov" data-a="close"><div class="sheet" data-stop="1" style="text-align:left;align-items:stretch"><div class="h2">Серия дней</div><div class="mu" style="line-height:1.5">Заходи в приложение каждый день — открой его, посмотри задание или рейтинг. Каждый день даёт +2 балла, а на 3, 7, 14, 30 и 100 днях открываются ачивки.</div>
      ${ms.map(m => `<div class="row" style="justify-content:space-between;min-height:40px"><div class="row"><span class="dot ${D.appBest >= m ? 'on' : ''}" style="width:14px;height:14px;border-width:2px;border-style:solid"></span><span>${m} ${plural(m, 'день', 'дня', 'дней')} подряд</span></div><span class="sm" style="font-weight:700;color:${D.appBest >= m ? 'var(--acc)' : 'var(--mu2)'}">${D.appBest >= m ? 'получено' : Math.min(D.appStreak, m) + '/' + m}</span></div>`).join('')}
      <div class="sm mu" style="line-height:1.5">Пропустил день — серия начнётся заново. Но раз в неделю серию спасает «заморозка»: если забыл зайти, она сработает сама (синий кружок).</div><button class="btn" data-a="close">Понятно</button></div></div>`;
  }
  if (o.type === 'scan') {
    return `<div class="ov" data-a="close"><div class="sheet" data-stop="1">${D.meet ? `<div class="circ got" style="width:96px;height:96px">${svg(I.scan, '#0E0F12', 44, 2.2)}</div><div class="h2">${esc(D.meet.label)}</div><div class="mu">Ты на встрече? Отметься — и получи +10 баллов.</div><button class="btn" data-a="checkin">Я на встрече</button>`
      : `<div class="circ" style="width:96px;height:96px">${svg(I.scan, '#8B8B94', 44, 2.2)}</div><div class="h2">Сейчас нет встречи</div><div class="mu" style="line-height:1.5">Кнопка заработает, когда начнётся общая встреча, малая группа или событие.</div>`}<button class="btn2" data-a="close">Закрыть</button></div></div>`;
  }
  if (o.type === 'done') return `<div class="ov" data-a="close"><div class="sheet" data-stop="1"><div class="circ got" style="width:104px;height:104px">${svg(I.check, '#0E0F12', 52, 3)}</div><div class="h2">Ты на месте!</div><div class="mu">${esc(o.label)} · ${o.already ? 'уже отмечен' : '+10 баллов'}</div><button class="btn" data-a="close">Готово</button></div></div>`;
  return '';
}
function render() {
  if (!S.token) { if (!S.nonce) prefetch(); $.innerHTML = viewLogin(); if (S.nonce) startPoll(); return; }
  if (!D) { $.innerHTML = `<div class="login" style="align-items:center"><div class="spin"></div></div>`; return; }
  const m = document.querySelector('.main'); const sc = m ? m.scrollTop : 0; const same = S.lastTab === S.tab; S.lastTab = S.tab;
  const body = { home: viewHome, badges: viewBadges, rank: viewRank, profile: viewProfile }[S.tab]();
  const tabs = [['home', 'Главная', I.home], ['badges', 'Ачивки', I.medal], ['scan', 'Отметиться', I.scan], ['rank', 'Рейтинг', I.trophy], ['profile', 'Профиль', I.user]];
  $.innerHTML = `<div class="app"><main class="main"><div class="wrap">${body}</div></main><nav class="nav">${tabs.map(([k, l, d]) => k === 'scan' ? `<button class="c" data-a="scan"><div class="ring">${svg(d, '#0E0F12', 26, 2.5)}</div><span>${l}</span></button>` : `<button class="${S.tab === k ? 'on' : ''}" data-a="tab" data-x="${k}">${svg(d, S.tab === k ? '#FF8A3D' : '#8B8B94', 24)}<span>${l}</span></button>`).join('')}</nav></div>${viewOverlay()}`;
  if (same) { const m2 = document.querySelector('.main'); if (m2) m2.scrollTop = sc; }
  syncUrl();
  const q = document.getElementById('invqr'); if (q && window.QRCode && D.invite) { q.innerHTML = ''; new QRCode(q, { text: D.invite.link, width: 150, height: 150, colorDark: '#0E0F12', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M }); }
}

const H = {
  reload() { load(); },
  prefetch() { S.err = ''; pre = null; prefetch(); render(); },
  cancelLogin() { clearNonce(); render(); },
  tab(x) { S.tab = x; S.ov = null; render(); const m = document.querySelector('.main'); if (m) m.scrollTop = 0; },
  scope(x) { S.scope = x; render(); },
  badge(x) { S.ov = { type: 'badge', id: x }; render(); },
  sg() { S.ov = { type: 'sg' }; render(); },
  route(x) { S.ov = { type: 'route', addr: x, back: S.ov }; render(); },
  async sgPick(id) { try { await api('groupReq', { groupId: id }); D.sg.req = { groupId: id, status: 'pending' }; S.ov = null; render(); toast('Заявка отправлена лидерам'); } catch (e) { toast(e.message === 'has_group' ? 'Ты уже в группе' : errT(e)); } },
  inst() { S.ov = { type: 'inst', v: 'pick' }; render(); },
  instGo(x) { S.ov = { type: 'inst', v: x }; render(); },
  instDone() { LS.set('sol_teen_inst', '1'); S.ov = null; render(); toast('Отлично! Открывай приложение с иконки'); },
  async verse(d) { const have = vNow(); S.ov = { type: 'verse', v: have && have.date === d && have.com ? have : null }; render();
    try { const v = await api('verse', { date: d }); if (S.ov && S.ov.type === 'verse') { S.ov.v = v; if (d === D.today) S.vfull = v; render(); } } catch (e) { toast(errT(e)); } },
  async vLike(d) { const v = vNow(); if (!v || S.vbusy) return; S.vbusy = 1; v.liked = !v.liked; v.likes += v.liked ? 1 : -1; render();
    try { S.vfull = await api('verseLike', { date: d }); } catch (e) { v.liked = !v.liked; v.likes += v.liked ? 1 : -1; toast(errT(e)); } S.vbusy = 0; render(); },
  async vShare() { const v = vNow(); const text = '«' + v.text + '» — ' + v.ref;
    if (navigator.share) { try { await navigator.share({ text, url: v.url }); } catch (e) {} } else { try { await navigator.clipboard.writeText(text + ' ' + v.url); toast('Стих скопирован'); } catch (e) { toast(text); } } },
  vEmo(e) { S.vc = (S.vc || '') + e; const i = document.getElementById('vci'); if (i) { i.value = S.vc; i.focus(); } },
  async vSend() { const o = S.ov, text = (S.vc || '').trim(); if (!o || !o.v || !text || S.vbusy) return; S.vbusy = 1;
    const first = !o.v.com.some(c => c.mine); const now = new Date(); const tmp = { id: 'tmp', name: (D.me.first + ' ' + (D.me.last ? D.me.last.charAt(0) + '.' : '')).trim(), text, ts: String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0'), mine: true, likes: 0, liked: false };
    o.v.com.push(tmp); o.v.ncom = o.v.com.length; S.vc = ''; render();
    try { const v = await api('verseCom', { date: o.v.date, text }); if (S.ov && S.ov.type === 'verse') S.ov.v = v; if (v.date === D.today) S.vfull = v; render(); if (first) toast('Комментарий отправлен · +' + (D.vcomPts || 5)); } catch (e) { o.v.com = o.v.com.filter(c => c !== tmp); o.v.ncom = o.v.com.length; S.vc = text; render(); toast(errT(e)); } S.vbusy = 0; },
  async vcLike(id) { const o = S.ov; if (!o || !o.v || S.vbusy || id === 'tmp') return; const c = o.v.com.find(x => x.id === id); if (!c) return; S.vbusy = 1; c.liked = !c.liked; c.likes += c.liked ? 1 : -1; render();
    try { const v = await api('vcLike', { id }); if (S.ov && S.ov.type === 'verse') { S.ov.v = v; render(); } } catch (e) { c.liked = !c.liked; c.likes += c.liked ? 1 : -1; render(); toast(errT(e)); } S.vbusy = 0; },
  levels() { S.ov = { type: 'levels' }; render(); },
  video(mon) { openVideo(mon); },
  invite() { S.ov = { type: 'invite' }; render(); },
  async invShare() { const url = D.invite.link, text = 'Приходи со мной на SOL 3:16 Teens! Запишись здесь:';
    if (navigator.share) { try { await navigator.share({ title: 'SOL 3:16 Teens', text, url }); } catch (e) {} } else H.invCopy(); },
  async invCopy() { try { await navigator.clipboard.writeText(D.invite.link); toast('Ссылка скопирована'); } catch (e) { toast(D.invite.link); } },
  async wk(id) { const k = D.week && D.week.tasks.find(x => x.id === id); if (!k) return; const was = k.status; k.status = 'pending'; render();
    try { await api('weekDone', { id }); toast('Отправлено лидеру на подтверждение'); } catch (e) { k.status = was; render(); toast(errT(e)); } },
  pf(k) { if (!k || k === 'phone') return; S.ov = { type: 'pf', part: k, err: '' }; render(); const f = document.querySelector('.sheet .inp'); if (f && !f.value) f.focus(); },
  async savePf() {
    const o = S.ov, f = {}; document.querySelectorAll('.sheet .inp').forEach(i => f[i.id.slice(3)] = i.value.trim());
    const need = { name: ['first', 'last'], birth: ['birth'], addr: ['addr'], parent: ['pFirst', 'pPhone'] }[o.part];
    if (need.some(k => !f[k])) { Object.assign(PF(), f); o.err = 'Заполни ' + (need.length > 1 ? 'оба поля' : 'поле') + ', чтобы сохранить.'; return render(); }
    const was = pfLeft().length;
    try { await api('saveProfile', { fields: f }); D = await api('me'); LS.set(MEC, JSON.stringify({ day: laToday(), d: D })); const left = pfLeft();
      if (was && !left.length) { S.ov = null; toast('Профиль заполнен! +30 и ачивка «Всё о себе»'); } else if (left.length && was) { S.ov = { type: 'pf', part: left[0], err: '' }; toast('Сохранено. Ещё чуть-чуть'); } else { S.ov = null; toast('Сохранено'); }
      render(); }
    catch (e) { Object.assign(PF(), f); o.err = errT(e); render(); }
  },
  daily() { H.path(); },
  pTip(i) { const o = S.ov; if (!o || o.type !== 'path') return; const sc = document.getElementById('pthsc'), y = sc ? sc.scrollTop : 0; o.tip = i === '' || +i === o.tip ? null : +i; render(); const s2 = document.getElementById('pthsc'); if (s2) s2.scrollTop = y; },
  path() { S.ov = { type: 'path' }; render(); pathScroll(); const im = document.querySelector('.pth img.t'); if (im) im.addEventListener('load', pathScroll, { once: true }); },
  scan() { S.ov = { type: 'scan' }; render(); },
  close() { S.ov = S.ov && S.ov.back ? S.ov.back : null; render(); },
  async done(id) { try { await api('taskDone', { taskId: id, on: true }); toast('Засчитано! Так держать'); D = await api('me'); render(); } catch (e) { toast(errT(e)); } },
  async undo(id) { try { await api('taskDone', { taskId: id, on: false }); D = await api('me'); render(); } catch (e) { toast(errT(e)); } },
  async tgVerify() { try { const r = await api('tgVerify'); if (r.ok) { toast('Ты в чате! +15 и ачивка «В чате»'); D = await api('me'); render(); } else toast('Пока не видим тебя в чате. Вступи и нажми «Проверить» ещё раз.'); } catch (e) { toast(errT(e)); } },
  async igSend() { try { await api('igSubmit', { nick: S.ig }); toast('Отправлено лидеру на проверку'); D = await api('me'); render(); } catch (e) { toast(errT(e)); } },
  async checkin() { try { const r = await api('checkin'); S.ov = { type: 'done', label: r.meet.label, already: r.already }; D = await api('me'); render(); } catch (e) { toast(errT(e)); } },
  async logout() { try { await call('logout', S.token); } catch (e) {} S.token = ''; LS.del('sol_teen_tok'); LS.del('sol_teen_me'); D = null; try { history.replaceState(null, '', location.pathname); } catch (e) {} render(); }
};
document.addEventListener('click', e => {
  const a = e.target.closest('[data-a]'); if (!a) return;
  if (a.getAttribute('data-a') === 'close' && e.target.closest('[data-stop]') && !e.target.closest('button[data-a="close"]')) return;
  const fn = H[a.getAttribute('data-a')]; if (fn) { e.preventDefault(); fn(a.getAttribute('data-x'), a); }
});
document.addEventListener('input', e => { const b = e.target.getAttribute && e.target.getAttribute('data-b'); if (b) S[b] = e.target.value; });

applyRoute();
if (S.token) { try { const c = JSON.parse(LS.get(MEC) || 'null'); if (c && c.day === laToday() && c.d) D = c.d; } catch (e) {} }
render();
loadVideos();
if (S.token) load();
setInterval(() => { if (!S.token && !S.nonce) prefetch(); }, 60000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
