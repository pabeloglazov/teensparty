<style>
:root{--bg:#0d0d0d;--fg:#f2efe8;--paper:#f2efe8;--ink:#0d0d0d;--orange:#ff5a1f;--orange-dark:#b83606;--muted:#b9b4ab;--cell:#262421;
  --display:Unbounded,"Arial Black",Impact,sans-serif;--body:Manrope,"Segoe UI",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden}
body{display:flex;flex-direction:column;cursor:none}
body.cur{cursor:default}
.strip{flex:none;overflow:hidden;font-family:var(--display);font-weight:900;white-space:nowrap;line-height:1;background:var(--orange);color:var(--ink);font-size:2.3vw;padding:1vw 0;transform:rotate(-1.2deg) scale(1.04);margin:1.6vw 0 .6vw;position:relative;z-index:2}
.strip.bot{background:var(--paper);font-size:1.6vw;transform:rotate(.8deg) scale(1.04);margin:.6vw 0 1.4vw;padding:.8vw 0}
.track{display:inline-flex;animation:mq 30s linear infinite}
.track span{padding-right:2.4vw}
.strip.bot .track{animation-direction:reverse;animation-duration:60s}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
main{flex:1;min-height:0;display:grid;grid-template-columns:31vw 1fr;gap:2.6vw;padding:1.4vw 2.6vw .6vw}
.left{display:flex;flex-direction:column;gap:1.2vw;min-height:0}
.kick{font-size:.95vw;font-weight:800;letter-spacing:.18em;color:var(--orange)}
h1{margin:.3vw 0 0;font-family:var(--display);font-weight:900;font-size:5.2vw;line-height:.86;letter-spacing:-.03em}
h1 span{display:block;animation:slam .6s cubic-bezier(.2,1.2,.4,1) both}
h1 .outline{color:var(--bg);-webkit-text-stroke:.14vw var(--fg);animation-delay:.12s}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--fg);border:2px solid var(--fg)}
.stat{background:var(--bg);padding:.7vw 1vw;display:flex;flex-direction:column;gap:.3vw}
.stat.hot{background:var(--orange);color:var(--ink)}
.stat .k{font-size:.72vw;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.stat .v{font-family:var(--display);font-weight:900;font-size:2.7vw;line-height:1;font-variant-numeric:tabular-nums}
.stat .v.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.18)}}
.join{display:flex;gap:1.2vw;align-items:center;background:var(--paper);color:var(--ink);border:3px solid var(--ink);box-shadow:.6vw .6vw 0 var(--orange);padding:.8vw;margin-bottom:.6vw;transform:rotate(-1.2deg);margin-right:.6vw}
.qr{width:7vw;height:7vw;flex:none;background:#fff;padding:.3vw}
.qr svg{display:block;width:100%;height:100%}
.join b{display:block;font-family:var(--display);font-weight:900;font-size:1.45vw;line-height:1.1}
.join span{display:block;font-weight:800;font-size:1vw;margin-top:.5vw;letter-spacing:.04em}
.top3{border:2px solid var(--fg);padding:.8vw 1vw;flex:1;min-height:0;overflow:hidden}
.top3 h3,.feed h3{margin:0 0 .4vw;font-size:.72vw;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:800;display:flex;align-items:center;gap:.5vw}
.pulse{width:.55vw;height:.55vw;background:var(--orange);animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:.2}}
.prow{display:flex;align-items:center;gap:.8vw;padding:.18vw 0;border-bottom:1px solid #2c2a27;font-size:1.05vw}
.prow:last-child{border:0}
.prow i{font-style:normal;font-family:var(--display);font-weight:900;width:1.8vw;color:var(--orange)}
.prow b{flex:1;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow em{font-style:normal;color:var(--muted);font-weight:800;font-size:.95vw}
.right{display:flex;flex-direction:column;gap:1.2vw;min-height:0}
.wall{flex:1;min-height:0;position:relative;overflow:hidden;border:2px solid #2c2a27;background:radial-gradient(circle at 30% 20%,#1b1a18,#0d0d0d 70%)}
.fl{position:absolute;left:0;top:0;margin:0;background:var(--paper);padding:.45vw .45vw 1.9vw;border:3px solid var(--ink);box-shadow:.5vw .5vw 0 var(--orange);will-change:transform,opacity}
.fl img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:#2a2826}
.fl figcaption{position:absolute;left:.5vw;right:.5vw;bottom:.35vw;color:var(--ink);font-family:var(--display);font-weight:900;font-size:.95vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl.hot{box-shadow:.5vw .5vw 0 var(--fg);z-index:5}
.wall .wait{position:absolute;inset:0;display:grid;place-items:center;color:#4a4640;font-family:var(--display);font-weight:900;font-size:1.6vw;text-align:center;padding:2vw}
.feed{flex:none;border:2px solid var(--fg);padding:.7vw 1vw;height:9.6vw;overflow:hidden}
.ev{display:flex;gap:1vw;align-items:baseline;font-size:1.1vw;font-weight:700;padding:.3vw 0}
.ev span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev small{color:var(--muted);font-weight:800;font-size:.8vw}
.ev.new{animation:nw 1.4s ease}

.spot{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(13,13,13,.86);backdrop-filter:blur(6px);animation:fi .3s}

.spot img{display:block;max-height:68vh;max-width:58vw;border:3px solid var(--ink)}
.spot .cap{font-family:var(--display);font-weight:900;font-size:2vw;margin-top:1vw}
.stampx{position:absolute;right:-2vw;top:-2vw;border:.35vw solid var(--orange-dark);color:var(--orange-dark);background:var(--paper);font-family:var(--display);font-weight:900;font-size:2.4vw;padding:.5vw 1vw;transform:rotate(10deg);animation:stamp .5s cubic-bezier(.3,1.6,.5,1) both .45s}
@keyframes stamp{from{transform:rotate(-10deg) scale(3);opacity:0}to{transform:rotate(10deg) scale(1);opacity:1}}
/* finale */
.fin{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
.fin[hidden]{display:none}
.mosaic{position:absolute;inset:0;display:grid;grid-template-columns:repeat(8,1fr);grid-auto-rows:12.5vw;gap:4px;opacity:.28;filter:grayscale(.6)}
.mosaic img{width:100%;height:100%;object-fit:cover;animation:fi 1s both}
.fwrap{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.4vw;padding:2vw}
.fwrap h2{margin:0;font-family:var(--display);font-weight:900;font-size:6vw;line-height:.9;text-align:center}
.fwrap h2 .outline{display:block;color:transparent;-webkit-text-stroke:.14vw var(--fg)}
.noms{display:grid;grid-template-columns:repeat(3,22vw);gap:2.4vw}
.nom{background:var(--paper);color:var(--ink);border:4px solid var(--ink);box-shadow:.9vw .9vw 0 var(--orange);padding:1.6vw 1.2vw;text-align:center;min-height:15vw;display:flex;flex-direction:column;justify-content:center;gap:1vw;transform:rotate(-1.5deg)}
.nom:nth-child(2){transform:rotate(1.2deg)}
.nom .k{font-size:.9vw;font-weight:800;letter-spacing:.16em;color:var(--orange-dark);text-transform:uppercase}
.nom .t{font-family:var(--display);font-weight:900;font-size:1.7vw;line-height:1.1}
.nom .n{font-family:var(--display);font-weight:900;font-size:2.4vw;line-height:1.05;min-height:1.1em}
.nom .n.hid{color:transparent;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 5px,var(--ink) 5px 9px,transparent 9px 11px);height:2.6vw}
.nom.on .n{animation:slam .5s cubic-bezier(.2,1.2,.4,1)}
.fsub{font-weight:800;letter-spacing:.2em;font-size:1.1vw;color:var(--muted);text-transform:uppercase}
.err{position:fixed;right:1vw;bottom:1vw;font-size:.8vw;color:var(--muted);font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

    var ph = (W && W.photos) || [];
    var mm = []; for (var k = 0; ph.length && k < 40; k++) mm.push(ph[k % ph.length]);
    $('mosaic').innerHTML = mm.map(function (p) { return '<img src="' + img(p.id, 400) + '" alt="">'; }).join('');
    $('noms').innerHTML = I.noms.map(function (n, i) {
      var on = i < revealed, nm = nomName(i);
      return '<div class="nom' + (on ? ' on' : '') + '"><span class="k">' + esc(n[1]) + '</span><span class="t">' + esc(n[0]) + '</span><span class="n' + (on ? '' : ' hid') + '">' + (on ? esc(nm || '???') : '') + '</span></div>';
    }).join('');
  }
  document.addEventListener('keydown', function (e) {
    if (e.key === 'f' || e.key === 'F' || e.key === 'а' || e.key === 'А') { var f = $('fin'); f.hidden = !f.hidden; revealed = 0; if (!f.hidden) renderFin(); else nextSpot(); }
    else if ((e.key === ' ' || e.key === 'ArrowRight') && !$('fin').hidden) { e.preventDefault(); if (revealed < 3) { revealed++; renderFin(); } }
    else if (e.key === 'ArrowLeft' && !$('fin').hidden) { if (revealed > 0) { revealed--; renderFin(); } }
  });
  $('fin').addEventListener('click', function () { if (revealed < 3) { revealed++; renderFin(); } });
  var curT; document.addEventListener('mousemove', function () { document.body.classList.add('cur'); clearTimeout(curT); curT = setTimeout(function () { document.body.classList.remove('cur'); }, 2000); });
  if (Q.get('final') === '1') { $('fin').hidden = false; }
  load();
})();
</script>
