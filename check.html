<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>TEENS PARTY Check-in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;900&family=Manrope:wght@500;700;800&display=swap">
<style>
/* Layout: one-column door tool — counters, search, verdict banner for scanned QR, result cards with a check-in button */
:root{
  --bg:#0d0d0d; --fg:#f2efe8; --paper:#f2efe8; --ink:#0d0d0d; --orange:#ff5a1f; --muted:#b9b4ab; --paper-muted:#55524c;
  --ok:#2fbf71; --bad:#e5484d; --line:#3a3733;
  --display:Unbounded, "Arial Black", Impact, sans-serif;
  --body:Manrope, "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body)}
button,input{font:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
main{max-width:560px;margin:0 auto;padding:24px 16px 48px;display:flex;flex-direction:column;gap:20px}
h1{margin:0;font-family:var(--display);font-weight:900;font-size:28px;letter-spacing:-.02em}
h1 span{color:var(--orange)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px;background:var(--fg);border:2px solid var(--fg)}
.stat{background:var(--bg);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.stat .k{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--muted)}
.stat .v{font-family:var(--display);font-weight:900;font-size:30px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:14px;color:var(--muted)}
form{display:flex;gap:8px}
input{flex:1;min-width:0;min-height:52px;padding:12px 14px;border:2px solid var(--fg);background:var(--bg);color:var(--fg);font-size:18px;font-weight:700;border-radius:0}
.btn{min-height:52px;padding:12px 18px;border:2px solid var(--fg);background:var(--fg);color:var(--ink);font-weight:800;cursor:pointer;white-space:nowrap}
.btn.orange{background:var(--orange);border-color:var(--orange)}
.btn:disabled{opacity:.5;cursor:default}
.hint{margin:0;font-size:14px;color:var(--muted);line-height:1.5}
.verdict{padding:18px;font-family:var(--display);font-weight:900;font-size:24px;color:var(--ink)}
.verdict.ok{background:var(--ok)}
.verdict.bad{background:var(--bad)}
.card{background:var(--paper);color:var(--ink);padding:16px;display:flex;flex-direction:column;gap:10px}
.row1{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.tno{font-family:var(--display);font-weight:900;font-size:22px}
.name{font-size:20px;font-weight:800}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px}
dt{color:var(--paper-muted);font-weight:700}
dd{margin:0;font-weight:700;min-width:0;overflow-wrap:anywhere}
.badge{font-size:13px;font-weight:800;padding:4px 8px;background:var(--ink);color:var(--paper);white-space:nowrap}
.badge.in{background:var(--ok);color:var(--ink)}
.card .btn{border-color:var(--ink);background:var(--orange)}
.actions{display:flex;gap:8px}
.actions .btn{flex:1}
.trash{flex:none;width:52px;min-height:52px;display:grid;place-items:center;border:2px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.trash:hover{background:var(--ink);color:var(--paper)}
.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;background:var(--bad);color:#fff;font-weight:800}
.confirm span{flex:1 1 160px}
.confirm button{min-height:44px;padding:8px 14px;border:2px solid #fff;background:transparent;color:#fff;font-weight:800;cursor:pointer}
.confirm button.yes{background:#fff;color:var(--bad)}
.err{margin:0;color:var(--bad);font-weight:800}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:8px 0;min-height:44px;align-self:flex-start}
</style>
</head>
<body>
<main>
  <h1>TEENS PARTY <span>CHECK-IN</span></h1>

  <section id="login" hidden>
    <form id="loginForm">
      <label for="key" class="hint" style="position:absolute;left:-9999px">Код доступа</label>
      <input id="key" type="password" autocomplete="current-password" placeholder="Код доступа">
      <button class="btn orange" type="submit">Войти</button>
    </form>
    <p class="err" id="loginErr" hidden>Неверный код.</p>
  </section>

  <section id="app" hidden style="display:flex;flex-direction:column;gap:20px">
    <div class="stats">
      <div class="stat"><span class="k">ЗАРЕГИСТРИРОВАНО</span><span class="v"><span id="sTaken">–</span> <small>/ <span id="sCap">–</span></small></span></div>
      <div class="stat"><span class="k">ПРИШЛИ</span><span class="v" id="sIn">–</span></div>
    </div>

    <div class="verdict" id="verdict" hidden></div>

    <form id="search">
      <label for="q" style="position:absolute;left:-9999px">Поиск</label>
      <input id="q" inputmode="search" autocomplete="off" placeholder="Телефон, TP-014 или имя">
      <button class="btn" type="submit">Найти</button>
    </form>
    <p class="hint">Сканируй QR из билета обычной камерой телефона, страница откроется сама. Без QR ищи по последним цифрам телефона, номеру билета или имени.</p>

    <p class="err" id="err" hidden></p>
    <div id="results" style="display:flex;flex-direction:column;gap:12px"></div>

    <button class="link" type="button" id="logout">Выйти</button>
  </section>
</main>

<script>
(function(){
  var API = 'https://script.google.com/macros/s/AKfycbzrKsCRRilLJLRPbAgoQ26ONDOv3liAsMgXgN0V3gIIInhhtdk8ZjMxWhABss3qh-Hq/exec';
  var $ = function(id){ return document.getElementById(id); };
  var key = '';
  try{ key = localStorage.getItem('tp_admin') || ''; }catch(e){}

  function post(body){
    body.key = key;
    return fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body)})
      .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  }
  function fmtPhone(p){ var d = String(p || '').replace(/\D/g,''); if(d.length === 11 && d[0] === '1') d = d.slice(1); return d.length === 10 ? '(' + d.slice(0,3) + ') ' + d.slice(3,6) + '-' + d.slice(6) : (p || '—'); }
  function el(tag, cls, text){ var e = document.createElement(tag); if(cls) e.className = cls; if(text !== undefined) e.textContent = text; return e; }

  function showApp(on){ $('login').hidden = on; $('app').hidden = !on; }
  function showErr(t){ $('err').textContent = t; $('err').hidden = !t; }

  function setStats(r){
    if(r.stats){ $('sTaken').textContent = r.stats.taken; $('sCap').textContent = r.stats.capacity; }
    if(typeof r.checkedIn === 'number') $('sIn').textContent = r.checkedIn;
  }

  function card(rec){
    var c = el('div', 'card');
    var r1 = el('div', 'row1');
    r1.appendChild(el('span', 'tno', rec.ticket));
    r1.appendChild(el('span', rec.checkedIn ? 'badge in' : 'badge', rec.checkedIn ? 'ВОШЁЛ ' + rec.checkedIn : 'ЕЩЁ НЕ ПРИШЁЛ'));
    c.appendChild(r1);
    c.appendChild(el('div', 'name', rec.name));
    var dl = el('dl');
    [['Возраст', rec.age], ['Телефон', fmtPhone(rec.phone)], ['Родитель', rec.parentName || '—'], ['Тел. родителя', rec.parentPhone ? fmtPhone(rec.parentPhone) : '—']]
      .forEach(function(p){ dl.appendChild(el('dt', '', p[0])); dl.appendChild(el('dd', '', String(p[1]))); });
    c.appendChild(dl);
    var actions = el('div', 'actions');
    c.appendChild(actions);
    if(!rec.checkedIn){
      var b = el('button', 'btn', 'ОТМЕТИТЬ ВХОД');
      b.type = 'button';
      b.addEventListener('click', function(){
        b.disabled = true; b.textContent = 'ОТМЕЧАЮ…';
        post({action:'checkin', ticket:rec.ticket}).then(function(r){
          if(!r.ok){ b.disabled = false; b.textContent = 'ОТМЕТИТЬ ВХОД'; showErr(r.code === 'key' ? 'Код доступа больше не подходит.' : 'Не получилось отметить.'); return; }
          c.replaceWith(card(r.record));
          var n = parseInt($('sIn').textContent, 10); if(!isNaN(n)) $('sIn').textContent = n + 1;
        }).catch(function(){ b.disabled = false; b.textContent = 'ОТМЕТИТЬ ВХОД'; showErr('Нет связи. Попробуй ещё раз.'); });
      });
      actions.appendChild(b);
    }
    var t = el('button', 'trash');
    t.type = 'button';
    t.setAttribute('aria-label', 'Удалить запись ' + rec.ticket);
    t.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="M19 6l-1 14H6L5 6"></path><path d="M10 11v6M14 11v6"></path></svg>';
    t.addEventListener('click', function(){
      if(c.querySelector('.confirm')) return;
      var box = el('div', 'confirm');
      box.appendChild(el('span', '', 'Удалить ' + rec.ticket + ' из таблицы? Это нельзя отменить.'));
      var yes = el('button', 'yes', 'Удалить'); yes.type = 'button';
      var no = el('button', '', 'Отмена'); no.type = 'button';
      box.appendChild(yes); box.appendChild(no);
      c.appendChild(box);
      no.addEventListener('click', function(){ box.remove(); });
      yes.addEventListener('click', function(){
        yes.disabled = no.disabled = true; yes.textContent = 'Удаляю…';
        post({action:'delete', ticket:rec.ticket}).then(function(r){
          if(!r.ok){ box.remove(); showErr(r.code === 'key' ? 'Код доступа больше не подходит.' : 'Запись не найдена — возможно, уже удалена.'); return; }
          setStats(r);
          var gone = el('div', 'card');
          gone.appendChild(el('div', 'name', rec.ticket + ' удалён'));
          c.replaceWith(gone);
          setTimeout(function(){ gone.remove(); }, 2500);
        }).catch(function(){ yes.disabled = no.disabled = false; yes.textContent = 'Удалить'; showErr('Нет связи. Попробуй ещё раз.'); });
      });
    });
    actions.appendChild(t);
    return c;
  }

  var seq = 0;
  function lookup(q, fromQr){
    var my = ++seq;
    showErr(''); $('results').textContent = ''; $('verdict').hidden = true;
    return post({action:'lookup', q:q}).then(function(r){
      if(my !== seq) return r;
      if(!r.ok){
        if(r.code === 'key'){ try{ localStorage.removeItem('tp_admin'); }catch(e){} key = ''; showApp(false); $('loginErr').hidden = false; }
        else showErr('Ошибка поиска.');
        return r;
      }
      setStats(r);
      if(fromQr){
        var v = $('verdict');
        v.hidden = false;
        if(r.valid === true){ v.className = 'verdict ok'; v.textContent = 'БИЛЕТ НАСТОЯЩИЙ'; }
        else { v.className = 'verdict bad'; v.textContent = r.results.length ? 'QR НЕ СОВПАДАЕТ' : 'БИЛЕТ НЕ НАЙДЕН'; }
      }
      if(!r.results.length && !fromQr) showErr('Никого не нашли.');
      r.results.forEach(function(rec){ $('results').appendChild(card(rec)); });
      return r;
    }).catch(function(){ if(my === seq) showErr('Нет связи с таблицей. Проверь интернет.'); });
  }

  var lastHash = '';
  function fromHash(){
    var h = decodeURIComponent(location.hash.replace(/^#/, ''));
    if(/^TP-\d{3}\.[A-Z0-9]{6}$/i.test(h)){
      if(h === lastHash) return true;
      lastHash = h; $('q').value = h.split('.')[0]; lookup(h, true); return true;
    }
    return false;
  }

  $('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    key = $('key').value.trim().toUpperCase();
    $('loginErr').hidden = true;
    post({action:'lookup', q:''}).then(function(r){
      if(!r.ok){ $('loginErr').hidden = false; return; }
      try{ localStorage.setItem('tp_admin', key); }catch(err){}
      showApp(true); setStats(r);
      if(!fromHash()) $('q').focus();
    }).catch(function(){ $('loginErr').textContent = 'Нет связи. Попробуй ещё раз.'; $('loginErr').hidden = false; });
  });

  $('search').addEventListener('submit', function(e){
    e.preventDefault();
    var q = $('q').value.trim();
    lastHash = '';
    if(q) lookup(q, false);
  });

  $('logout').addEventListener('click', function(){
    try{ localStorage.removeItem('tp_admin'); }catch(e){}
    key = ''; $('key').value = ''; showApp(false);
  });

  window.addEventListener('hashchange', function(){ if(key) fromHash(); });

  if(key){
    showApp(true);
    if(!fromHash()) post({action:'lookup', q:''}).then(function(r){ if(r.ok) setStats(r); else { key=''; showApp(false); } }).catch(function(){});
  } else {
    showApp(false);
  }
})();
</script>
</body>
</html>
