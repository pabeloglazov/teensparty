<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Шары на проверке · TEENS PARTY Christmas</title>
<link rel="icon" href="/app/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700&family=Inter:wght@400;600;700&display=swap">
<style>
/* Страница лидера: проверка шаров гирлянды. Вход — тот же, что в 3:16 Check-in (общий сайт, общий вход). */
*{box-sizing:border-box}
body{margin:0;background:#0E0F12;color:#F4F4F5;font:16px/1.45 Inter,system-ui,sans-serif}
.w{max-width:720px;margin:0 auto;padding:24px 16px 80px;display:flex;flex-direction:column;gap:18px}
h1{margin:0;font:700 26px/1.1 Unbounded,sans-serif}
.mu{color:#A1A1AA;font-size:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid #3A3D46;background:#15171B;color:#F4F4F5;font:600 14px Inter,sans-serif;cursor:pointer}
.tabs button.on{background:#FF8A3D;border-color:#FF8A3D;color:#0E0F12}
.tabs button:hover{filter:brightness(1.12)}
.list{display:flex;flex-direction:column;gap:10px}
.it{display:flex;gap:14px;align-items:center;background:#15171B;border:1px solid #2A2D35;border-radius:18px;padding:14px}
.b{flex:none;width:72px;height:72px;border-radius:50%;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:#0E0F12;font:700 26px Unbounded,sans-serif}
.b.red{background-color:#EF4444}.b.gold{background-color:#F5C542}.b.white{background-color:#FBF7EE}.b.blue{background-color:#60A5FA}.b.green{background-color:#4ADE80}
.tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.tx b{font-size:17px;overflow-wrap:anywhere}
.tx span{color:#D4D4D8;font-size:15px;overflow-wrap:anywhere}
.st{font-size:12px;font-weight:700;letter-spacing:.08em}
.st.wait{color:#F5C542}.st.ok{color:#4ADE80}.st.no{color:#F87171}
.ac{flex:none;display:flex;flex-direction:column;gap:8px}
.ac button{min-height:44px;min-width:112px;padding:0 14px;border-radius:12px;border:0;font:700 14px Inter,sans-serif;cursor:pointer;transition:filter .15s}
.ac button:hover{filter:brightness(1.12)}
.ac button:disabled{opacity:.5;cursor:default}
.ac .ok{background:#22C55E;color:#0E0F12}.ac .no{background:#15171B;color:#F4F4F5;border:1px solid #3A3D46!important}
.empty{padding:28px;text-align:center;border:1px dashed #3A3D46;border-radius:18px;color:#A1A1AA}
a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 20px;border-radius:14px;background:#FF8A3D;color:#0E0F12;text-decoration:none;font-weight:700}
@media (max-width:520px){.it{flex-wrap:wrap}.ac{flex-direction:row;width:100%}.ac button{flex:1}}
</style>
</head>
<body>
<div class="w">
  <div><h1>Шары на проверке</h1><div class="mu">TEENS PARTY Christmas · гирлянда на странице события. Шар виден всем только после «Одобрить».</div></div>
  <div class="tabs" id="tabs"></div>
  <div class="list" id="list"><div class="empty">Загружаем…</div></div>
</div>
<script>
(function(){
  var API = 'https://script.google.com/macros/s/AKfycbw1J4PnxNLtZ8H8dCWhJpTiAeA2V-X5RWmJdB6VQPr_IFzemiKS-y_SW50PvR0dAnL6Cg/exec', EID = 'EMWJ5HI0V1X';
  var tok = ''; try{ tok = localStorage.getItem('sol_tok') || ''; }catch(e){}
  var L = document.getElementById('list'), TB = document.getElementById('tabs'), all = [], tab = 'wait', busy = {};
  var NAME = {wait:'На проверке', ok:'Одобрены', no:'Скрыты'};
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function call(fn, args){ return fetch(API, {method:'POST', body:JSON.stringify({fn:fn, args:args})}).then(function(r){ return r.json(); }).then(function(j){ if(!j.ok) throw new Error(j.error || 'error'); return j.data; }); }
  function login(){ TB.innerHTML = ''; L.innerHTML = '<div class="empty">Чтобы проверять шары, войдите в 3:16 Check-in на этом устройстве и вернитесь сюда.<br><br><a class="btn" href="/app/">Открыть Check-in</a></div>'; }
  function draw(){
    TB.innerHTML = ['wait','ok','no'].map(function(k){ return '<button type="button" data-t="' + k + '" class="' + (tab === k ? 'on' : '') + '">' + NAME[k] + ' · ' + all.filter(function(b){ return b.status === k; }).length + '</button>'; }).join('');
    var rows = all.filter(function(b){ return b.status === tab; });
    L.innerHTML = rows.length ? rows.map(function(b){ var c = /^(red|gold|white|blue|green)$/.test(b.c) ? b.c : 'red';
      return '<div class="it"><div class="b ' + c + '"' + (b.p ? ' style="background-image:url(' + esc(b.p) + ')"' : '') + '>' + (b.p ? '' : esc(String(b.n || '?').charAt(0).toUpperCase())) + '</div><div class="tx"><b>' + esc(b.n) + '</b>' + (b.w ? '<span>«' + esc(b.w) + '»</span>' : '<span class="mu">без пожелания</span>') + '<span class="st ' + b.status + '">' + NAME[b.status].toUpperCase() + '</span></div><div class="ac">' +
        (b.status !== 'ok' ? '<button type="button" class="ok" data-id="' + esc(b.id) + '" data-s="ok"' + (busy[b.id] ? ' disabled' : '') + '>Одобрить</button>' : '') + (b.status !== 'no' ? '<button type="button" class="no" data-id="' + esc(b.id) + '" data-s="no"' + (busy[b.id] ? ' disabled' : '') + '>Скрыть</button>' : '') + '</div></div>'; }).join('')
      : '<div class="empty">' + (tab === 'wait' ? 'Новых шаров нет.' : 'Пусто.') + '</div>';
  }
  function load(){ return call('ballsAdmin', [tok, EID]).then(function(d){ all = d.slice().reverse(); draw(); }).catch(function(e){ if(e.message === 'auth') login(); else L.innerHTML = '<div class="empty">Не получилось загрузить. Проверьте интернет и обновите страницу.</div>'; }); }
  TB.addEventListener('click', function(e){ var b = e.target.closest('[data-t]'); if(b){ tab = b.getAttribute('data-t'); draw(); } });
  L.addEventListener('click', function(e){ var b = e.target.closest('[data-id]'); if(!b) return; var id = b.getAttribute('data-id'), s = b.getAttribute('data-s'); if(busy[id]) return; busy[id] = 1; draw();
    call('ballMod', [tok, id, s]).then(function(){ all.forEach(function(x){ if(x.id === id) x.status = s; }); }).catch(function(e){ if(e.message === 'auth') login(); }).then(function(){ delete busy[id]; draw(); }); });
  if(!tok) login(); else load();
})();
</script>
</body>
</html>
